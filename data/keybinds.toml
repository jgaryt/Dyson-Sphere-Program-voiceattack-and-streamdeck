# Your Dyson Sphere Program key bindings.
#
# Every control is listed with DSP's default key, commented out. If you've rebound a control in
# the game (Settings > Controls), uncomment its line here and set the same key, then run
# `python scripts/build_all.py`. Voice commands, both Stream Deck profiles and the docs follow it.
#
# Keys: 0-9, A-Z, F1-F12, Esc, Space, Alt, or Shift/Alt + one of those (e.g. "Shift+F11").
# Two controls can't share a key; the build checks this.

[keys]
# Build bars (number keys open a bar)
# bar1 = "1"        # Power
# bar2 = "2"        # Collecting
# bar3 = "3"        # Logistics
# bar4 = "4"        # Storage
# bar5 = "5"        # Production
# bar6 = "6"        # Transportation
# bar7 = "7"        # Defence
# bar8 = "8"        # COSMO
# bar9 = "9"        # Foundation

# Build slots (F-keys pick a building on the open bar)
# slot1 = "F1"
# slot2 = "F2"
# slot3 = "F3"
# slot4 = "F4"
# slot5 = "F5"
# slot6 = "F6"
# slot7 = "F7"
# slot8 = "F8"
# slot9 = "F9"
# slot10 = "F10"

# Build mode
# cancel = "Esc"
# upgrade = "U"
# dismantle = "X"
# copy = "Shift+LeftClick"   # copy selected building's settings

# Movement and camera
# fly = "Space"              # pressed twice
# land = "Alt"
# face_north = "N"
# screenshot = "Shift+F11"

# Panels
# mecha = "C"
# statistics = "P"
# inventory = "E"
# replicator = "F"
# details = "H"
# tech_tree = "T"
# logistics = "I"
# starmap = "V"
# planet = "M"
