# Dyson Sphere Program voice and Stream Deck commands: the single source of truth.
#
# Every VoiceAttack profile, Stream Deck profile, icon and doc is generated from this file.
# Run `python scripts/build_all.py` after editing.
#
# Fields
#   name     Building or action name (as the game shows it)
#   bar, key Build bar number and F-key (buildings).  steps = key steps (everything else):
#            "C", "Shift+F11", "Shift+LeftClick", "Alt", "wait:100" (pause in ms)
#   phrase   VoiceAttack phrase. [a;b] = either, [a;] = optional. Buildings also accept
#            "build"/"place" in front automatically.
#   reply    What Icarus says (one picked at random). Must never match a phrase.
#   deck     Stream Deck button: label, page/row/col (row = "bottom" = same on every page),
#            group (colour) and glyph (icon), optional tier badge, optional say = phrase the
#            VoiceAttack Stream Deck button sends (defaults to the first spoken form).
#   status   confirmed | likely | guess | locked
#   note     Free text


