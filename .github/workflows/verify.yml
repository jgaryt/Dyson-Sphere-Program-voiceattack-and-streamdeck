name: Verify

# Checks data/commands.toml (reply loops, deck collisions, deck phrases) and that the
# committed profiles, icons and docs were rebuilt from it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check data and generated files
        run: python scripts/verify_build.py
